<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>My_first_weather_website</title>
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="enter city name" spellcheck="false" />
        <button><img src="./weather-images/search.png" /></button>
      </div>

      <div class="error">
        <p>Invalid city name</p>
      </div>

      <div class="weather">
        <img
          src="./weather-images/rain.png"
          alt="dowmlaod"
          class="weather-icon"
        />
        <h1 class="temp">20°c</h1>
        <h2 class="city">Bamenda</h2>

        <div class="details">
          <div class="col">
            <img src="./weather-images/humidity.png" alt="download" />
            <div>
              <p class="humidity">50</p>
              <p>Humidity</p>
            </div>
          </div>

          <div class="col">
            <img src="./weather-images/wind.png" alt="download" />
            <div>
              <p class="wind">15km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
